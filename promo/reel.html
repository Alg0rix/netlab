<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>netlab showreel</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=block" rel="stylesheet" />
<style>
  :root { --bg: #000; --ink: #e9edf4; --dim: #8a94a6; --accent: #4c9bff; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px Inter, system-ui, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  canvas { width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; display: block; background: #05070b; }
  body.render #stage { place-items: start; }
  body.render canvas { width: 1920px; height: 1080px; }
  body.render #ui { display: none; }
  #ui { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); width: min(820px, calc(100vw - 32px)); display: flex; gap: 12px; align-items: center;
        padding: 10px 14px; border-radius: 12px; background: rgba(12, 16, 24, .82); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,.08);
        opacity: 0; transition: opacity .25s; }
  body:hover #ui, #ui.show { opacity: 1; }
  #ui button { all: unset; cursor: pointer; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; background: var(--accent); color: #fff; }
  #ui input { flex: 1; accent-color: var(--accent); }
  #ui span { font: 12px "JetBrains Mono", monospace; color: var(--dim); min-width: 92px; text-align: right; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<div id="ui" class="show"><button id="pp" aria-label="Play">▶</button><input id="scrub" type="range" min="0" max="88" step="0.01" value="0" /><span id="tc">0.00 / 88.00</span></div>
<audio id="music" src="build/music.m4a" preload="auto"></audio>
<script type="module">
import { FPS, DURATION, SCENES, CHAPTERS, SEGMENTS, DEMO_START, DEMO_END, footageAt, CAMERA, CALLOUTS } from './timeline.js';
import { iconSVG } from '../web/icons.js';

const RENDER = new URLSearchParams(location.search).has('render');
if (RENDER) document.body.classList.add('render');

const cv = document.getElementById('c');
const g = cv.getContext('2d');
const W = 1920, H = 1080, CX = W / 2, CY = H / 2, TAU = Math.PI * 2;

/* ───────────────────────── math & easing ───────────────────────── */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  lin: t => t,
  out2: t => 1 - (1 - t) * (1 - t),
  out3: t => 1 - Math.pow(1 - t, 3),
  in3: t => t * t * t,
  inOut3: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outExpo: t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inExpo: t => t <= 0 ? 0 : Math.pow(2, 10 * t - 10),
  inOutExpo: t => t <= 0 ? 0 : t >= 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2,
  outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  outBackBig: t => { const c1 = 2.6, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  outElastic: t => t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * (TAU / 3)) + 1,
};
const ep = (t, a, b, e = E.out3) => e(prog(t, a, b));
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const beat = t => Math.exp(-((t % 0.5 + 0.5) % 0.5) * 9);   // 120 BPM kick envelope

/* ───────────────────────── palette & type ───────────────────────── */
const COL = {
  bg: '#05070b', ink: '#e9edf4', dim: '#8d97a9', mute: '#4b5566', line: '#1a2130', card: '#0b1018',
  blue: '#4c9bff', teal: '#2fd0c0', violet: '#a58bff', amber: '#f2b84b', green: '#3ccf7e', red: '#ff5d5d', orange: '#ff9e5a',
};
const F = (w, s) => `${w} ${s}px Inter, "Inter Display", system-ui, sans-serif`;
const M = (w, s) => `${w} ${s}px "JetBrains Mono", "DejaVu Sans Mono", monospace`;
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; };

/* ───────────────────────── assets ───────────────────────── */
const ICON = {};
for (const id of ['router', 'switch', 'pc', 'laptop', 'server', 'ios', 'routeros', 'x86']) {
  const im = new Image();
  im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(iconSVG(id));
  ICON[id] = im;
}
const CLIPS = {};
const imgCache = new Map();
let lastFootage = {};
function loadImg(src) {
  if (imgCache.has(src)) return imgCache.get(src).p;
  const im = new Image();
  const p = new Promise(r => { im.onload = () => im.decode().then(r, r); im.onerror = r; });
  im.src = src;
  imgCache.set(src, { im, p });
  if (imgCache.size > 90) imgCache.delete(imgCache.keys().next().value);
  return p;
}
function frameAt(clip, ct) {
  const fr = CLIPS[clip].frames;
  let lo = 0, hi = fr.length - 1;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (fr[mid].t <= ct) lo = mid; else hi = mid - 1; }
  return `capture/out/${clip}/${fr[lo].f}`;
}
function cursorAt(clip, ct) {
  const cu = CLIPS[clip].cursor;
  if (!cu.length || ct <= cu[0].t) return { x: 800, y: 450 };
  let lo = 0, hi = cu.length - 1;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (cu[mid].t <= ct) lo = mid; else hi = mid - 1; }
  const a = cu[lo], b = cu[Math.min(lo + 1, cu.length - 1)];
  if (b === a || b.t - a.t > 0.2) return { x: a.x, y: a.y };
  const k = clamp((ct - a.t) / (b.t - a.t));
  return { x: lerp(a.x, b.x, k), y: lerp(a.y, b.y, k) };
}

// pre-rendered textures
function mk(w, h, fn) { const c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d'), c); return c; }
const GRAIN = [0, 1, 2, 3, 4, 5].map(s => mk(384, 384, (x, c) => {
  const id = x.createImageData(c.width, c.height), r = mulberry32(s + 9);
  for (let i = 0; i < id.data.length; i += 4) { const v = r() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  x.putImageData(id, 0, 0);
}));
const VIGNETTE = mk(W, H, x => {
  const gr = x.createRadialGradient(CX, CY, H * .35, CX, CY, H * 1.05);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.72)');
  x.fillStyle = gr; x.fillRect(0, 0, W, H);
});
const DOTS = mk(48, 48, x => { x.fillStyle = 'rgba(140,160,200,.22)'; x.beginPath(); x.arc(24, 24, 1.3, 0, TAU); x.fill(); });

/* ───────────────────────── drawing primitives ───────────────────────── */
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function glow(x, y, r, color, a = 1) {
  if (a <= 0 || r <= 0) return;
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, rgba(color, .55 * a)); gr.addColorStop(.35, rgba(color, .18 * a)); gr.addColorStop(1, rgba(color, 0));
  g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
}
function setFont(f, track = 0) { g.font = f; g.letterSpacing = track + 'px'; }
function txt(s, x, y, f, color = COL.ink, align = 'left', track = 0, base = 'alphabetic') {
  setFont(f, track); g.textAlign = align; g.textBaseline = base; g.fillStyle = color; g.fillText(s, x, y);
}
function tw(s, f, track = 0) { setFont(f, track); return g.measureText(s).width; }
function icon(id, x, y, size, a = 1) { if (a <= 0) return; g.globalAlpha *= a; g.drawImage(ICON[id], x - size / 2, y - size / 2, size, size); g.globalAlpha /= a; }

// Kinetic type: words rise out of a mask, staggered. parts = string | [[text, color], …]
function rise(parts, x, y, lt, { size = 80, weight = 800, align = 'center', stagger = .07, dur = .8, exit = null, exitDur = .45, track = -2, mono = false, glitch = null, color = COL.ink } = {}) {
  if (lt < 0) return;
  if (typeof parts === 'string') parts = [[parts, color]];
  const f = mono ? M(weight, size) : F(weight, size);
  const units = [];
  for (const [s, c] of parts) for (const w of s.split(/(?<= )/)) if (w) units.push({ s: w, c });
  setFont(f, track);
  let total = 0;
  for (const u of units) { u.w = g.measureText(u.s).width; total += u.w; }
  let cx = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
  g.save();
  g.beginPath(); g.rect(cx - size, y - size * 1.05, total + size * 2, size * 1.42); g.clip();
  g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  units.forEach((u, i) => {
    const p = E.outExpo(prog(lt, i * stagger, i * stagger + dur));
    const q = exit == null ? 0 : E.in3(prog(lt, exit + i * stagger * .5, exit + i * stagger * .5 + exitDur));
    const dy = (1 - p) * size * 1.15 - q * size * 1.2;
    g.globalAlpha = clamp(p * 1.4) * (1 - q);
    g.fillStyle = u.c;
    if (glitch && u.c === glitch.color && lt > glitch.a && lt < glitch.b) {
      const k = Math.floor(lt * 30), j = (hash(k) - .5) * 14, j2 = (hash(k + 7) - .5) * 8;
      g.globalCompositeOperation = 'lighter';
      g.fillStyle = 'rgba(255,40,80,.85)'; g.fillText(u.s, cx + j, y + dy + j2 * .3);
      g.fillStyle = 'rgba(40,220,255,.85)'; g.fillText(u.s, cx - j, y + dy - j2 * .3);
      g.globalCompositeOperation = 'source-over';
      if (hash(k + 3) > .5) { g.save(); g.beginPath(); g.rect(cx, y + dy - size * .55, u.w, size * .18); g.clip(); g.fillStyle = u.c; g.fillText(u.s, cx + j * 1.6, y + dy); g.restore(); }
      g.fillStyle = u.c;
    }
    g.fillText(u.s, cx, y + dy);
    cx += u.w;
  });
  g.restore();
  g.globalAlpha = 1;
}

function pill(x, y, label, { color = COL.blue, size = 18, a = 1, align = 'left', dot = true, mono = true, fill = null } = {}) {
  const f = mono ? M(700, size) : F(700, size);
  const w = tw(label, f, 1) + size * (dot ? 2.4 : 1.6), h = size * 2;
  const x0 = align === 'center' ? x - w / 2 : x;
  g.globalAlpha = a;
  rr(x0, y - h / 2, w, h, h / 2); g.fillStyle = fill ?? rgba(color, .13); g.fill();
  g.strokeStyle = rgba(color, .45); g.lineWidth = 1.2; g.stroke();
  if (dot) { g.fillStyle = color; g.beginPath(); g.arc(x0 + size * .95, y, size * .26, 0, TAU); g.fill(); }
  txt(label, x0 + size * (dot ? 1.6 : .8), y + size * .36, f, color, 'left', 1);
  g.globalAlpha = 1;
  return w;
}

// Logo mark from the app (24-unit viewBox): three nodes, three links.
const LOGO_N = [[5, 12], [19, 5], [19, 19]];
const LOGO_L = [[[7.4, 11], [16.6, 6]], [[7.4, 13], [16.6, 18]], [[19, 7.6], [19, 16.4]]];
function logoMark(x, y, k, lt, { orbit = true } = {}) {
  // x,y = top-left of the 24×24 box scaled by k
  const P = ([a, b]) => [x + a * k, y + b * k];
  g.lineCap = 'round';
  LOGO_L.forEach(([a, b], i) => {
    const p = ep(lt, .35 + i * .1, .75 + i * .1, E.inOut3);
    if (p <= 0) return;
    const [x1, y1] = P(a), [x2, y2] = P(b);
    const gr = g.createLinearGradient(x1, y1, x2, y2); gr.addColorStop(0, COL.blue); gr.addColorStop(1, COL.teal);
    g.strokeStyle = gr; g.lineWidth = k * 1.6;
    g.beginPath(); g.moveTo(x1, y1); g.lineTo(lerp(x1, x2, p), lerp(y1, y2, p)); g.stroke();
  });
  LOGO_N.forEach((n, i) => {
    const p = ep(lt, i * .15, i * .15 + .5, E.outBackBig);
    if (p <= 0) return;
    const [px, py] = P(n);
    glow(px, py, k * 9 * clamp(p), i ? COL.teal : COL.blue, .9);
    g.fillStyle = i === 0 ? COL.blue : i === 1 ? '#3fb6e0' : COL.teal;
    g.beginPath(); g.arc(px, py, k * 2.6 * p, 0, TAU); g.fill();
  });
  if (orbit && lt > 1) {
    // packets chase around the triangle
    const pts = [P(LOGO_N[0]), P(LOGO_N[1]), P(LOGO_N[2])];
    for (let j = 0; j < 2; j++) {
      const u = ((lt - 1) * .45 + j * .5) % 1 * 3, seg = Math.floor(u), f = u - seg;
      const order = [0, 1, 2, 0], a = pts[order[seg]], b = pts[order[seg + 1]];
      const px = lerp(a[0], b[0], f), py = lerp(a[1], b[1], f);
      glow(px, py, k * 4, '#ffffff', .7 * clamp(lt - 1));
      g.fillStyle = `rgba(255,255,255,${clamp(lt - 1)})`; g.beginPath(); g.arc(px, py, k * .7, 0, TAU); g.fill();
    }
  }
}
function wordmark(x, y, size, lt, color = COL.ink) {
  setFont(F(800, size), -size * .045);
  g.textBaseline = 'alphabetic'; g.textAlign = 'left';
  let cx = x;
  g.save(); g.beginPath(); g.rect(x - 10, y - size * 1.05, size * 5, size * 1.35); g.clip();
  for (let i = 0; i < 6; i++) {
    const ch = 'netlab'[i], p = E.outExpo(prog(lt, i * .05, i * .05 + .7));
    g.globalAlpha = p; g.fillStyle = color;
    g.fillText(ch, cx, y + (1 - p) * size * 1.1);
    cx += g.measureText(ch).width;
  }
  g.restore(); g.globalAlpha = 1;
  return cx - x;
}

function cursorShape(x, y, s, a = 1, press = 0) {
  if (a <= 0) return;
  g.save(); g.translate(x, y); g.scale(s * (1 - press * .12), s * (1 - press * .12)); g.globalAlpha = a;
  g.shadowColor = 'rgba(0,0,0,.55)'; g.shadowBlur = 8; g.shadowOffsetY = 2;
  g.beginPath(); g.moveTo(0, 0); g.lineTo(0, 17.5); g.lineTo(4.4, 13.4); g.lineTo(7.4, 20); g.lineTo(10.2, 18.8); g.lineTo(7.3, 12.4); g.lineTo(13, 12.4); g.closePath();
  g.fillStyle = '#fff'; g.fill(); g.shadowBlur = 0; g.shadowOffsetY = 0;
  g.lineWidth = 1.3; g.strokeStyle = '#0a0d12'; g.stroke();
  g.restore();
}

/* ───────────────────────── backgrounds ───────────────────────── */
function background(t, { dots = .6, warm = 0, hueShift = 0 } = {}) {
  g.fillStyle = COL.bg; g.fillRect(0, 0, W, H);
  const b1x = CX + Math.sin(t * .23) * 520, b1y = CY + Math.cos(t * .17) * 260;
  const b2x = CX + Math.cos(t * .19 + 1) * 600, b2y = CY + Math.sin(t * .21 + 2) * 300;
  g.globalCompositeOperation = 'lighter';
  glow(b1x, b1y, 900, warm > 0 ? COL.red : COL.blue, .28 * (1 - warm * .3));
  glow(b2x, b2y, 800, warm > 0 ? COL.orange : COL.violet, .2);
  g.globalCompositeOperation = 'source-over';
  if (dots > 0) {
    g.save(); g.globalAlpha = dots;
    g.fillStyle = g.createPattern(DOTS, 'repeat');
    const ox = (t * 6) % 48, oy = (t * 3) % 48;
    g.translate(-ox, -oy); g.fillRect(0, 0, W + 48, H + 48);
    g.restore();
  }
}
function finish(t) {
  g.drawImage(VIGNETTE, 0, 0);
  const k = Math.floor(t * FPS);
  g.save(); g.globalAlpha = .055; g.globalCompositeOperation = 'overlay';
  g.fillStyle = g.createPattern(GRAIN[k % 6], 'repeat');
  g.translate(-(hash(k) * 384) | 0, -(hash(k + 1) * 384) | 0); g.fillRect(0, 0, W + 384, H + 384);
  g.restore();
}
function flash(a, color = '#ffffff') { if (a <= 0) return; g.fillStyle = color; g.globalAlpha = clamp(a); g.fillRect(0, 0, W, H); g.globalAlpha = 1; }

/* ═════════════════════════ SCENE 1+2: the network & the problem ═════════════════════════ */
const NET = (() => {
  const r = mulberry32(11), nodes = [{ x: 0, y: 0 }];
  let guard = 0;
  while (nodes.length < 38 && guard++ < 5000) {
    const a = r() * TAU, d = 150 + Math.pow(r(), .8) * 980;
    const p = { x: Math.cos(a) * d * 1.3, y: Math.sin(a) * d * .78 };
    if (nodes.every(n => Math.hypot(n.x - p.x, n.y - p.y) > 165)) nodes.push(p);
  }
  // Prim's tree from the origin → reveal order
  const inT = new Set([0]); nodes[0].t = .55; nodes[0].depth = 0;
  const edges = [];
  while (inT.size < nodes.length) {
    let best = null;
    for (const i of inT) for (let j = 0; j < nodes.length; j++) if (!inT.has(j)) {
      const d = Math.hypot(nodes[i].x - nodes[j].x, nodes[i].y - nodes[j].y);
      if (!best || d < best.d) best = { i, j, d };
    }
    inT.add(best.j);
    const p = nodes[best.i], c = nodes[best.j];
    c.depth = p.depth + 1; c.parent = best.i;
    const t0 = p.t + .12 + 0 * best.d;
    edges.push({ a: best.i, b: best.j, t0: p.t + .05, dur: best.d / 1500 + .12, len: best.d });
    c.t = edges.at(-1).t0 + edges.at(-1).dur;
  }
  // a few cross-links so it reads as a mesh
  for (let i = 1; i < nodes.length; i++) {
    let best = null;
    for (let j = 0; j < nodes.length; j++) if (j !== i && j !== nodes[i].parent && nodes[j].parent !== i) {
      const d = Math.hypot(nodes[i].x - nodes[j].x, nodes[i].y - nodes[j].y);
      if (!best || d < best.d) best = { j, d };
    }
    if (best && r() < .45 && best.d < 420) edges.push({ a: i, b: best.j, t0: Math.max(nodes[i].t, nodes[best.j].t) + .1, dur: best.d / 1500 + .1, len: best.d, cross: true });
  }
  const kinds = ['router', 'switch', 'switch', 'pc', 'laptop', 'server', 'pc'];
  nodes.forEach((n, i) => { n.kind = i === 0 ? 'router' : n.depth === 1 ? 'router' : n.depth === 2 ? 'switch' : kinds[3 + (i % 4)]; });
  return { nodes, edges };
})();
const PKT_COLORS = [COL.blue, COL.teal, COL.violet, COL.amber, COL.green];

function drawNetwork(t, { scale, ox = 0, oy = 0, rot = 0, grey = 0, alpha = 1, implode = 0 }) {
  g.save();
  g.translate(CX + ox, CY + oy); g.rotate(rot); g.scale(scale, scale);
  const P = n => [n.x * (1 - implode), n.y * (1 - implode)];
  g.lineCap = 'round';
  // links
  for (const [ei, e] of NET.edges.entries()) {
    const p = ep(t, e.t0, e.t0 + e.dur, E.inOut3);
    if (p <= 0) continue;
    const [x1, y1] = P(NET.nodes[e.a]), [x2, y2] = P(NET.nodes[e.b]);
    g.strokeStyle = grey ? `rgba(120,130,150,${.35 * alpha})` : rgba(e.cross ? '#3a4a66' : '#4a6fa8', .7 * alpha);
    g.lineWidth = 2.2 / scale;
    g.beginPath(); g.moveTo(x1, y1); g.lineTo(lerp(x1, x2, p), lerp(y1, y2, p)); g.stroke();
    // drawing head glows
    if (p < 1) glow(lerp(x1, x2, p), lerp(y1, y2, p), 26 / scale, COL.blue, alpha);
    // packets travelling the link
    const live = t - (e.t0 + e.dur);
    if (live > 0 && !grey) {
      const sp = 380 / e.len;
      const u = (live * sp + hash(ei) * 3) % 2.2;
      if (u < 1) {
        const dir = ei % 2 ? u : 1 - u;
        const c = PKT_COLORS[ei % PKT_COLORS.length];
        for (let k = 0; k < 6; k++) {
          const uu = clamp(dir + (ei % 2 ? -1 : 1) * k * .018);
          const px = lerp(x1, x2, uu), py = lerp(y1, y2, uu);
          g.fillStyle = rgba(c, alpha * (1 - k / 6));
          g.beginPath(); g.arc(px, py, (5 - k * .6) / scale, 0, TAU); g.fill();
        }
        glow(lerp(x1, x2, dir), lerp(y1, y2, dir), 30 / scale, c, alpha * .9);
      }
    }
  }
  // nodes
  for (const [i, n] of NET.nodes.entries()) {
    const p = ep(t, n.t, n.t + .45, E.outBackBig);
    if (p <= 0) continue;
    const [x, y] = P(n);
    const s = (i === 0 ? 74 : n.depth === 1 ? 62 : 54) / Math.max(scale, .6) * .9;
    if (!grey) glow(x, y, s * 1.5 * p, i === 0 ? COL.blue : COL.teal, .55 * alpha * (1 + beat(t) * .4));
    g.globalAlpha = alpha * (grey ? .45 : 1);
    if (grey) g.filter = 'grayscale(1) brightness(.7)';

function drawFootage(st, x, y, w, h, push = 1) {

const toScreen = (st, ax, ay, ox, oy, w) => {

function chapterTitle(t) {

function callouts(st, ox, oy, w, h) {

function drawCursor(st, ox, oy, w, h) {

/* ───────────────────────── frame composer ───────────────────────── */
function render(t) {
  performanceNowT = t;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.filter = 'none';
  const warm = t > 6.6 && t < 11.6 ? ep(t, 6.6, 7.4) * (1 - ep(t, 10.9, 11.6)) : 0;
  background(t, { dots: t < 32 || t > 70 ? .55 : .35, warm });
  if (t < 11.6) sceneOpen(t);
  if (t >= 6 && t < 12.05) sceneProblem(t);
  if (t >= 12 && t < 20.05) sceneReveal(t);
  if (t >= 19.98 && t < 32.05) sceneHow(t);
  if (t >= 32 && t < 70.5) sceneDemo(t);
  if (t >= 69.9 && t < 78.2) sceneFeatures(t);
  if (t >= 77.9) sceneOutro(t);
  // dip-flashes on the big hits
  for (const h of [20, 70, 78]) flash(.22 * (1 - prog(t, h, h + .3)) * (t >= h ? 1 : 0), '#bcd6ff');
  flash(1 - prog(t, 0, .4), '#000');
  finish(t);
}

/* ───────────────────────── boot, seek, preview ───────────────────────── */
async function boot() {
  await Promise.all(['build', 'sim', 'cap'].map(async c => { CLIPS[c] = await (await fetch(`capture/out/${c}/clip.json`)).json(); }));
  await Promise.all(Object.values(ICON).map(im => im.decode().catch(() => {})));
  await Promise.all([F(800, 100), F(900, 100), F(700, 30), F(600, 30), F(500, 30), M(500, 20), M(700, 20)].map(f => document.fonts.load(f)));
  await document.fonts.ready;
}
async function prepare(t) {
  if (t >= 32.7 && t <= 70.5) {
    const st = demoState(t);
    await loadImg(st.src);
    lastFootage[st.clip] = imgCache.get(st.src).im;
  }
}
window.__seek = async t => { await prepare(t); render(t); };
window.__ready = boot();
window.__meta = { FPS, DURATION };

if (!RENDER) {
  await window.__ready;
  const audio = document.getElementById('music'), pp = document.getElementById('pp'), scrub = document.getElementById('scrub'), tc = document.getElementById('tc');
  let playing = false, t = 0, last = 0;
  const show = () => { scrub.value = t; tc.textContent = `${t.toFixed(2)} / ${DURATION.toFixed(2)}`; };
  const toggle = () => {
    playing = !playing; pp.textContent = playing ? '❚❚' : '▶';
    if (playing) { if (t >= DURATION) t = 0; audio.currentTime = t; audio.play().catch(() => {}); last = performance.now(); }
    else audio.pause();
  };
  pp.onclick = toggle;
  scrub.oninput = () => { t = +scrub.value; audio.currentTime = t; prepare(t).then(() => render(t)); show(); };
  addEventListener('keydown', e => { if (e.key === ' ') { e.preventDefault(); toggle(); } if (e.key === 'ArrowRight') { t = Math.min(DURATION, t + 2); audio.currentTime = t; } if (e.key === 'ArrowLeft') { t = Math.max(0, t - 2); audio.currentTime = t; } });
  const loop = now => {
    if (playing) {
      t = !audio.paused && audio.readyState > 2 ? audio.currentTime : t + (now - last) / 1000;
      last = now;
      if (t >= DURATION) { t = DURATION; toggle(); }
      prepare(t + .05);   // prefetch
      show();
    }
    render(t);
    requestAnimationFrame(loop);
  };
  const qt = new URLSearchParams(location.search).get('t');
  if (qt) t = +qt;
  await prepare(t);
  requestAnimationFrame(loop);
}
</script>
